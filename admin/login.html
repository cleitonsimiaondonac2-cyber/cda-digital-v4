<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Painel de Administração - CDA Digital">
    <link rel="icon" type="image/x-icon" href="../img/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gellix:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilo.css">
    <link rel="stylesheet" href="css/admin.css">
    <title>Entrar - Painel de Administração CDA</title>
</head>
<body class="admin-login-page">
    <div class="admin-login-container">
        <div class="admin-login-card">
            <div class="admin-login-header">
                <div class="admin-logo">
                    <img src="../img/logos/cda-logo.svg" alt="CDA Digital" class="admin-logo-img">
                </div>
                <h1 class="admin-login-title">Painel de Administração</h1>
                <p class="admin-login-subtitle">CDA Digital - Cámara dos Despachantes Aduaneiros</p>
            </div>
            
            <form id="admin-login-form" class="admin-login-form">
                <div class="form-group">
                    <label for="admin-username">Utilizador</label>
                    <div class="input-wrapper">
                        <svg class="icon input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" id="admin-username" name="username" placeholder="Introduza o utilizador" required autocomplete="username">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="admin-password">Palavra-passe</label>
                    <div class="input-wrapper">
                        <svg class="icon input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="admin-password" name="password" placeholder="Introduza a palavra-passe" required autocomplete="current-password">
                        <button type="button" class="password-toggle" aria-label="Mostrar palavra-passe">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="admin-remember">
                        <span class="checkbox-input"></span>
                        <span class="checkbox-label">Lembrar-me</span>
                    </label>
                    <a href="#" class="forgot-password">Esqueceu a palavra-passe?</a>
                </div>
                
                <button type="submit" class="btn btn-primary btn-lg btn-block">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                        <polyline points="10,17 15,12 10,7"/>
                        <line x1="15" y1="12" x2="3" y2="12"/>
                    </svg>
                    Entrar
                </button>
                
                <div class="admin-login-error" id="login-error" hidden>
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                    <span id="error-message"></span>
                </div>
            </form>
            
            <div class="admin-login-footer">
                <p>© 2026 CDA Digital. Todos os direitos reservados.</p>
            </div>
        </div>
        
        <div class="admin-login-decoration">
            <div class="decoration-circle circle-1"></div>
            <div class="decoration-circle circle-2"></div>
            <div class="decoration-circle circle-3"></div>
        </div>
    </div>
    
    <script src="../js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('admin-login-form');
            const errorContainer = document.getElementById('login-error');
            const errorMessage = document.getElementById('error-message');
            const passwordInput = document.getElementById('admin-password');
            const passwordToggle = document.querySelector('.password-toggle');
            
            // Alternar visibilidade da palavra-passe
            if (passwordToggle) {
                passwordToggle.addEventListener('click', function() {
                    const type = passwordInput.type === 'password' ? 'text' : 'password';
                    passwordInput.type = type;
                    this.innerHTML = type === 'password' ? 
                        '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/></svg>' :
                        '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/></svg><line x1="1" y1="1" x2="23" y2="23"/></svg>';
                });
            }
            
            // Simular login (para demo)
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('admin-username').value;
                const password = document.getElementById('admin-password').value;
                
                // Credenciais de demo
                if (username === 'admin' && password === 'admin123') {
                    // Guardar estado de login
                    sessionStorage.setItem('cda_admin_logged', 'true');
                    sessionStorage.setItem('cda_admin_user', username);
                    // Redirecionar para dashboard
                    window.location.href = 'index.html';
                } else {
                    // Mostrar erro
                    errorMessage.textContent = 'Utilizador ou palavra-passe incorrectos';
                    errorContainer.hidden = false;
                }
            });
            
            // Verificar se já está logado
            if (sessionStorage.getItem('cda_admin_logged') === 'true') {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
